<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Zoom</title>
  <meta name="description" content="從地球一路 zoom in，到台灣、自然教室、海報中的水滴，最後進入葉綠體。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://prayer168.github.io/earth-zoom-in/">
  <meta property="og:title" content="從地球到葉綠體">
  <meta property="og:description" content="從宏觀宇宙到微觀生命，一路 zoom in 到葉片裡的光合作用世界。">
  <meta property="og:image" content="https://prayer168.github.io/earth-zoom-in/thumbnail.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="從地球到葉綠體">
  <meta name="twitter:description" content="從宏觀宇宙到微觀生命，一路 zoom in 到葉片裡的光合作用世界。">
  <meta name="twitter:image" content="https://prayer168.github.io/earth-zoom-in/thumbnail.jpg">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      overflow: hidden;
    }

    main {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <video autoplay muted loop playsinline>
      <source src="earth-to-chloroplast-continuous-zoom.mp4" type="video/mp4">
    </video>
  </main>
  <script>
    const video = document.querySelector("video");
    video.addEventListener("click", () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });
  </script>
</body>
</html>
