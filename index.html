<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Zoom</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      overflow: hidden;
    }

    main {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <video autoplay muted loop playsinline>
      <source src="earth-to-chloroplast-continuous-zoom.mp4" type="video/mp4">
    </video>
  </main>
  <script>
    const video = document.querySelector("video");
    video.addEventListener("click", () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });
  </script>
</body>
</html>
